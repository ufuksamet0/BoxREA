[package]
name = "rea-desktop"
version = "0.1.0"
description = "BoxREA Desktop App Backend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
walkdir = "2"
ignore = "0.4"
dirs = "5"

# REA Core integration (via sidecar or FFI)
# For now we'll use sidecar to run the Node.js core