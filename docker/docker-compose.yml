version: '3.8'

services:
  # REA MCP Server - Main analysis engine
  rea-mcp:
    image: ghcr.io/morluto/rea-agents:6.7.0
    container_name: rea-mcp
    volumes:
      - ${TARGETS_DIR:-./targets}:/targets:ro
      - ${EVIDENCE_DIR:-./evidence}:/evidence
      - ${REA_CONFIG_DIR:-./config}:/config
    environment:
      - REA_GHIDRA_PATH=/opt/ghidra
      - REA_IDA_PATH=/opt/ida
      - REA_KUNA_COMMAND=/usr/local/bin/kuna
      - REA_WABT_BIN_DIRECTORY=/opt/wabt/bin
      - REA_TSHARK_COMMAND=/usr/bin/tshark
      - REA_SIGROK_COMMAND=/usr/bin/sigrok-cli
      - REA_KUNA_CACHE_DIR=/cache/kuna
    ports:
      - "3000:3000"  # MCP server port (if HTTP mode)
    networks:
      - rea-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "npx", "-y", "rea-agents@6.7.0", "doctor", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ghidra Headless Analyzer
  ghidra:
    image: ghcr.io/morluto/ghidra-headless:11.2
    container_name: rea-ghidra
    volumes:
      - ${GHIDRA_SCRIPTS_DIR:-./ghidra_scripts}:/scripts:ro
      - ${TARGETS_DIR:-./targets}:/targets:ro
      - ${EVIDENCE_DIR:-./evidence}:/evidence
    environment:
      - GHIDRA_INSTALL_DIR=/opt/ghidra
      - JAVA_HOME=/usr/lib/jvm/java-21-openjdk
    networks:
      - rea-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    # Runs as sidecar - invoked by rea-mcp via REA_GHIDRA_PATH

  # IDA Pro MCP Server (requires license)
  # ida-mcp:
  #   image: mrexodia/ida-pro-mcp:9.0
  #   container_name: rea-ida-mcp
  #   volumes:
  #     - ${IDA_LICENSE_DIR:-./ida_license}:/license:ro
  #     - ${TARGETS_DIR:-./targets}:/targets:ro
  #     - ${EVIDENCE_DIR:-./evidence}:/evidence
  #   environment:
  #     - IDALICENSE=/license/ida.lic
  #     - IDA_PATH=/opt/ida/ida64
  #   ports:
  #     - "3001:3001"
  #   networks:
  #     - rea-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G

  # Kuna Whole-Program Analysis
  kuna:
    image: ghcr.io/morluto/kuna:latest
    container_name: rea-kuna
    volumes:
      - ${KUNA_CACHE_DIR:-./kuna_cache}:/cache
      - ${TARGETS_DIR:-./targets}:/targets:ro
      - ${EVIDENCE_DIR:-./evidence}:/evidence
    environment:
      - KUNA_CACHE_DIR=/cache
      - KUNA_EXPORT_DIR=/evidence/kuna-exports
    networks:
      - rea-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    command: ["server", "--host", "0.0.0.0", "--port", "3002"]

  # Firmware Analysis Tools (Binwalk, Unblob, etc.)
  firmware-tools:
    image: ghcr.io/morluto/firmware-analysis:latest
    container_name: rea-firmware
    volumes:
      - ${TARGETS_DIR:-./targets}:/targets:ro
      - ${EVIDENCE_DIR:-./evidence}:/evidence
    environment:
      - BINWALK_EXTRACT_DIR=/evidence/binwalk
      - UNBLOB_EXTRACT_DIR=/evidence/unblob
    networks:
      - rea-network
    deploy:
      resources:
        limits:
          memory: 4G

  # Android Analysis (JADX, apktool, etc.)
  android-tools:
    image: ghcr.io/morluto/android-analysis:latest
    container_name: rea-android
    volumes:
      - ${TARGETS_DIR:-./targets}:/targets:ro
      - ${EVIDENCE_DIR:-./evidence}:/evidence
    networks:
      - rea-network
    deploy:
      resources:
        limits:
          memory: 4G

  # Network Capture Analysis (tshark, mitmproxy)
  network-tools:
    image: ghcr.io/morluto/network-analysis:latest
    container_name: rea-network-tools
    volumes:
      - ${CAPTURES_DIR:-./captures}:/captures:ro
      - ${EVIDENCE_DIR:-./evidence}:/evidence
    networks:
      - rea-network
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # Reverse Proxy / API Gateway (optional)
  # nginx:
  #   image: nginx:alpine
  #   container_name: rea-nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   networks:
  #     - rea-network
  #   depends_on:
  #     - rea-mcp
  #     - kuna

networks:
  rea-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  kuna_cache:
  evidence:
  targets: